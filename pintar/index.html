<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Grobogan - Inovasi Pendidikan</title>
    
    <!-- PWA Manifest Placeholder -->
    <link rel="manifest" id="manifest-placeholder">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#991b1b', // Crimson Red / Maroon
                        secondary: '#ef4444', // Vibrant Red
                        accent: '#eab308', // Gold
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff1f2; color: #334155; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Glassmorphism Classes (Red Tint) */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(254, 226, 226, 0.5); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; border: 1px solid rgba(254, 202, 202, 0.4); box-shadow: 0 4px 6px -1px rgba(153, 27, 27, 0.05), 0 2px 4px -1px rgba(153, 27, 27, 0.03); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffe4e6; }
        ::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } 
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Layout Structure */
        #app-wrapper { display: flex; min-height: 100vh; flex-direction: column; }
        #main-content { flex: 1; padding-bottom: 5.5rem; transition: all 0.3s ease; }
        
        /* Safe area for iOS devices */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
            #main-content { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
        }
        
        @media (min-width: 768px) {
            #app-wrapper { flex-direction: row; }
            #main-content { padding-bottom: 0; margin-left: 16rem; }
            #bottom-nav { display: none; }
            #sidebar { display: flex; }
        }
        
        @media (max-width: 767px) {
            #sidebar { display: none; }
            #bottom-nav { display: flex; }
        }
        
        /* Transitions */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal Overlay */
        #modal-overlay { z-index: 10000; }
        
        /* App Branding Dinamis */
        .app-logo-bg { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffffff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'); background-size: 60%; background-repeat: no-repeat; background-position: center; }
    </style>
</head>
<body class="antialiased">

    <!-- UI Modal Custom (Pengganti Alert & Confirm) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center fade-in px-4">
        <div class="glass-card w-full max-w-md p-6 md:p-8 relative">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors">
                <i class="fas fa-times text-2xl"></i>
            </button>
            <div id="modal-icon" class="text-center text-5xl mb-4"></div>
            <h3 id="modal-title" class="text-xl font-bold text-center text-slate-800 mb-2"></h3>
            <p id="modal-message" class="text-center text-slate-600 mb-6 text-sm leading-relaxed"></p>
            <div class="flex justify-center gap-3" id="modal-actions">
                <button onclick="window.closeModal()" class="px-8 py-3 bg-primary text-white rounded-full font-bold hover:bg-red-900 transition-colors shadow-lg active:scale-95 w-full sm:w-auto">Tutup</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper">
        <!-- Sidebar Desktop -->
        <nav id="sidebar" class="w-64 glass h-screen fixed left-0 top-0 flex-col border-r border-rose-200 z-50">
            <div class="p-6 border-b border-rose-100 flex flex-col items-center">
                <div id="brand-logo-desktop" class="w-20 h-20 bg-gradient-to-tr from-primary to-secondary text-white rounded-2xl flex items-center justify-center shadow-lg mb-3 overflow-hidden app-logo-bg border-2 border-white"></div>
                <h1 id="brand-name-desktop" class="text-xl font-black text-slate-800 text-center leading-tight">Pintar Grobogan</h1>
                <p class="text-xs font-semibold text-secondary mt-1 text-center bg-red-50 px-3 py-1 rounded-full"><i class="fas fa-medal mr-1"></i> Inovasi Pendidikan</p>
            </div>
            <div class="flex-1 overflow-y-auto py-4 px-3 hide-scrollbar" id="desktop-menu-container">
                <!-- Menu dirender via JS -->
            </div>
            <div class="p-4 border-t border-rose-200 bg-rose-50/50" id="desktop-user-info">
                <!-- User info dirender via JS -->
            </div>
        </nav>

        <!-- Bottom Nav Mobile -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 w-full glass border-t border-rose-200 z-50 justify-around items-center px-1 py-2 pb-safe shadow-[0_-10px_15px_-3px_rgba(153,27,27,0.05)] bg-white/95">
            <!-- Menu dirender via JS -->
        </nav>

        <!-- Konten Utama -->
        <main id="main-content" class="w-full min-h-screen relative transition-all duration-300">
            <!-- Header Mobile -->
            <header class="md:hidden glass sticky top-0 z-40 px-4 py-3 border-b border-rose-200 flex justify-between items-center shadow-sm bg-white/90">
                <div class="flex items-center gap-3">
                    <div id="brand-logo-mobile" class="w-10 h-10 bg-gradient-to-tr from-primary to-secondary text-white rounded-xl flex items-center justify-center shadow-sm overflow-hidden app-logo-bg border border-white"></div>
                    <h1 id="brand-name-mobile" class="font-black text-lg text-slate-800 tracking-tight">Pintar Grobogan</h1>
                </div>
                <div id="mobile-header-user"></div>
            </header>

            <!-- Area View Dinamis -->
            <div id="view-container" class="p-4 md:p-8 w-full max-w-6xl mx-auto">
                <!-- Loading Spinner Default -->
                <div class="flex flex-col justify-center items-center h-64 gap-4">
                    <div class="w-12 h-12 border-4 border-rose-200 border-t-primary rounded-full animate-spin"></div>
                    <p class="text-primary font-semibold animate-pulse">Memuat Sistem Inovasi...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. KONFIGURASI FIREBASE ANDA
        // ==========================================
        // Ganti nilai-nilai di bawah ini dengan Firebase Config dari Console Anda
        const firebaseConfig = {
  apiKey: "AIzaSyCsxdF9d4R1Stae6uBh4ptBNKgXh9nzsbI",
  authDomain: "pintar-d4cf3.firebaseapp.com",
  projectId: "pintar-d4cf3",
  storageBucket: "pintar-d4cf3.firebasestorage.app",
  messagingSenderId: "442069251976",
  appId: "1:442069251976:web:22cc820f913f145cc4ac3d",
  measurementId: "G-J2T9VZ7FZN"
        };
        const appId = 'pintar-grobogan-app';

        // Initialize Firebase
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State Aplikasi Inti
        window.appState = {
            user: null, 
            role: 'guest', // 'guest', 'user', 'admin'
            currentView: 'beranda',
            karyaList: [],
            informasiList: [],
            pengaturan: { nama_aplikasi: 'Pintar Grobogan', logo_url: '' },
            diskusiList: [],
            raporList: [],
            pengawas: { nama: 'Lilik Rahmawati, M.Pd', jabatan: 'Pengawas Sekolah Kabupaten Grobogan', nip: '', foto_url: '', kutipan: 'Inovasi bukan sekadar membuat yang baru, tapi bagaimana karya kita mampu memberikan solusi nyata bagi pembelajaran anak didik. Mari jadikan jejak digital Bapak/Ibu sebagai inspirasi yang tak lekang oleh waktu.' },
            pesanList: [],
            dash: { tab: 'karya', q: '', kat: 'Semua', userCount: null },
            liveDb: false,
            dbReady: false
        };

        // Helper Path Firestore (Serverless Architecture)
        const getCol = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        // --- SISTEM MODAL & UI HELPERS (Pengganti Alert/Confirm) ---
        window.showModal = (title, message, isError = false, customActionsHtml = null) => {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message; 
            
            const icon = document.getElementById('modal-icon');
            if (isError) icon.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500 drop-shadow-md"></i>';
            else icon.innerHTML = '<i class="fas fa-check-circle text-green-500 drop-shadow-md"></i>';
            
            const actions = document.getElementById('modal-actions');
            if(customActionsHtml) {
                actions.innerHTML = customActionsHtml;
            } else {
                actions.innerHTML = `<button onclick="window.closeModal()" class="px-8 py-3 bg-primary text-white rounded-full font-bold hover:bg-red-900 transition-colors shadow-lg active:scale-95 w-full sm:w-auto">Tutup</button>`;
            }
            
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        const formatDate = (timestamp) => {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        };

        // Update Identitas Web Berdasarkan Pengaturan Database Admin
        function updateAppIdentity() {
            const nama = window.appState.pengaturan.nama_aplikasi || 'Pintar Grobogan';
            const logo = window.appState.pengaturan.logo_url;
            
            document.title = `${nama} - Inovasi Pendidikan`;
            document.getElementById('brand-name-desktop').textContent = nama;
            document.getElementById('brand-name-mobile').textContent = nama;

            const updateLogo = (id) => {
                const el = document.getElementById(id);
                if(el) {
                    if(logo) { 
                        el.innerHTML = `<img src="${logo}" class="w-full h-full object-cover">`; 
                        el.classList.remove('app-logo-bg'); 
                    } else { 
                        el.innerHTML = ''; 
                        el.classList.add('app-logo-bg'); 
                    }
                }
            };
            updateLogo('brand-logo-desktop');
            updateLogo('brand-logo-mobile');
            renderNavigation(); 
        }

        // --- SISTEM AWAL (DATABASE & AUTH) ---
        async function initFirebaseAuth() {
            try {
                const isDummy = firebaseConfig.apiKey.includes("DummyKey");
                if (!isDummy) await signInAnonymously(auth);
                
                if (!isDummy) await autoSetupDatabase();
                else {
                    window.appState.pengaturan = { nama_aplikasi: 'Pintar Grobogan (Preview Offline)', logo_url: '' };
                    updateAppIdentity();
                    fallbackOfflineData();
                    bukaTampilanAwal();
                }
            } catch (error) {
                console.warn("Koneksi Firebase ditolak. Menjalankan mode Fallback.");
                fallbackOfflineData();
                bukaTampilanAwal();
            }
        }

        function fallbackOfflineData() {
            window.appState.karyaList = [
                { id: '1', id_user: "dummy_id", nama_pembuat: "Budi Santoso, S.Pd", kategori_karya: "Modul Ajar", judul: "Modul Ajar Interaktif IPA Kelas 8", deskripsi: "Modul ajar digital terintegrasi materi Sistem Pencernaan.", link_file: "https://drive.google.com/file/d/xxx", timestamp: Date.now() }
            ];
            window.appState.informasiList = [
                { id: '1', judul: "Selamat Datang di Pintar Grobogan", isi: "Platform inovasi guru, siswa, dan kepala sekolah. (Mode Offline Preview)", timestamp: Date.now() }
            ];
        }

        function bukaTampilanAwal() {
            window.appState.dbReady = true;
            renderNavigation();
            window.navigateTo('beranda');
        }

        async function autoSetupDatabase() {
            try {
                // Setup Pengaturan if missing
                const setSnap = await getDocs(getCol('pengaturan'));
                if (setSnap.empty) {
                    await setDoc(getDocRef('pengaturan', 'app_settings'), { nama_aplikasi: "Pintar Grobogan", logo_url: "", timestamp: Date.now() });
                }

                const usersSnap = await getDocs(getCol('users'));
                if (usersSnap.empty) {
                    console.log("Menyiapkan struktur awal database...");
                    // Inject Dummy Data First Time
                    await addDoc(getCol('users'), { username: "guru123", password: "password123", nama: "Budi Santoso, S.Pd", kategori: "guru", sekolah: "SMPN 1 Purwodadi", foto_profil: "", nip: "198001012005011001", timestamp: Date.now() });
                    await addDoc(getCol('karya'), { id_user: "dummy_id", nama_pembuat: "Budi Santoso, S.Pd", kategori_karya: "Modul Ajar", judul: "Modul Ajar Interaktif IPA Berbasis Masalah", deskripsi: "Modul terintegrasi yang memudahkan siswa memahami IPA.", link_file: "https://drive.google.com/file/d/dummy", timestamp: Date.now() });
                    await addDoc(getCol('informasi'), { judul: "Selamat Datang di Portal Inovasi", isi: "Mari membagikan karya inovasi Anda di sini. Ini adalah langkah awal ekosistem pendidikan cerdas di Kabupaten Grobogan.", timestamp: Date.now() });
                }
                startDataListeners();
                bukaTampilanAwal();
            } catch (error) {
                console.warn("Mode Fallback (No Write Access) - Cek Security Rules Firebase Anda.");
                fallbackOfflineData();
                bukaTampilanAwal();
            }
        }

        let unsubs = [];

        // Render ulang bagian halaman yang sedang dibuka tanpa menghapus isian form
        function refreshView() {
            const v = window.appState.currentView;
            if(v === 'kelola_informasi') renderKelolaInfoList();
            else if(v === 'diskusi') renderDiskusiList();
            else if(v === 'kotak_masuk') renderKotakMasukList();
            else if(v === 'pantau_karya') { if(document.getElementById('dash-table')) renderDashAll(); else renderCurrentView(); }
            else if(['beranda', 'galeri', 'informasi', 'karya_saya'].includes(v)) renderCurrentView();
        }

        function startDataListeners() {
            unsubs.forEach(unsub => unsub()); unsubs = [];
            const st = window.appState;
            const listen = (name, key, sorter, after) => {
                try {
                    unsubs.push(onSnapshot(getCol(name), (snapshot) => {
                        const arr = [];
                        snapshot.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        arr.sort(sorter);
                        st[key] = arr;
                        if(after) after();
                        refreshView();
                    }, (err) => console.warn('Listener "' + name + '" gagal (cek Security Rules):', err.message)));
                } catch(e) { console.warn(e); }
            };
            const asc = (a, b) => (a.timestamp || 0) - (b.timestamp || 0);
            const desc = (a, b) => (b.timestamp || 0) - (a.timestamp || 0);

            try {
                unsubs.push(onSnapshot(getDocRef('pengaturan', 'app_settings'), (docSnap) => {
                    if (docSnap.exists()) { st.pengaturan = docSnap.data(); updateAppIdentity(); }
                }, (err) => console.warn('Listener pengaturan gagal:', err.message)));
            } catch(e) {}

            try {
                unsubs.push(onSnapshot(getDocRef('pengaturan', 'data_pengawas'), (docSnap) => {
                    if (docSnap.exists()) {
                        st.pengawas = { ...st.pengawas, ...docSnap.data() };
                        renderNavigation();
                        if(st.currentView === 'beranda') renderCurrentView();
                    }
                }, (err) => console.warn('Listener data pengawas gagal:', err.message)));
            } catch(e) {}

            listen('karya', 'karyaList', asc);
            listen('informasi', 'informasiList', desc);
            listen('diskusi', 'diskusiList', asc);
            listen('rapor_pendidikan', 'raporList', desc);
            listen('pesan_pengawas', 'pesanList', desc, () => renderNavigation());
            st.liveDb = true;
        }

        // --- Helper database (mendukung mode offline/preview) ---
        async function dbAdd(col, listKey, data) {
            if(window.appState.liveDb) return addDoc(getCol(col), data);
            window.appState[listKey].push({ id: 'local_' + Date.now(), ...data });
            refreshView();
        }
        async function dbUpdate(col, listKey, id, data) {
            if(window.appState.liveDb) return updateDoc(getDocRef(col, id), data);
            const item = window.appState[listKey].find(x => x.id === id);
            if(item) Object.assign(item, data);
            refreshView();
        }

        // --- NAVIGASI & MENU ---
        window.navigateTo = (view) => {
            window.appState.currentView = view;
            renderNavigation();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function menuBadge(id) {
            if(id !== 'kotak_masuk' || window.appState.role !== 'admin') return '';
            const n = window.appState.pesanList.filter(p => !p.dibaca).length;
            return n ? `<span class="ml-auto bg-secondary text-white text-[10px] font-black px-2 py-0.5 rounded-full">${n}</span>` : '';
        }

        function renderNavigation() {
            const role = window.appState.role;
            const menus = [
                // Publik
                { id: 'beranda', title: 'Beranda', icon: 'fa-home', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'galeri', title: 'Galeri', icon: 'fa-images', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'informasi', title: 'Informasi', icon: 'fa-bullhorn', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'diskusi', title: 'Diskusi', icon: 'fa-comments', roles: ['guest', 'user', 'admin'], isBottom: false },
                { id: 'sapa', title: 'Sapa Pengawas', icon: 'fa-envelope-open-text', roles: ['guest', 'user'], isBottom: false },
                
                // User (Guru/Siswa/Kepsek)
                { id: 'profil', title: 'Profil Saya', icon: 'fa-id-card', roles: ['user'], isBottom: true },
                { id: 'unggah_karya', title: 'Unggah Karya', icon: 'fa-cloud-upload-alt', roles: ['user'], isBottom: false },
                { id: 'unggah_rapor', title: 'Rapor Digital', icon: 'fa-file-signature', roles: ['user'], isBottom: false },
                { id: 'karya_saya', title: 'Karya Saya', icon: 'fa-folder-open', roles: ['user'], isBottom: false },
                
                // Admin (Pengawas)
                { id: 'pantau_karya', title: 'Dasbor Data', icon: 'fa-chart-pie', roles: ['admin'], isBottom: true },
                { id: 'kelola_pengguna', title: 'Pengguna', icon: 'fa-users-cog', roles: ['admin'], isBottom: false },
                { id: 'kelola_informasi', title: 'Kelola Info', icon: 'fa-edit', roles: ['admin'], isBottom: false },
                { id: 'profil_pengawas', title: 'Profil Pengawas', icon: 'fa-user-tie', roles: ['admin'], isBottom: false },
                { id: 'kotak_masuk', title: 'Pesan Masuk', icon: 'fa-inbox', roles: ['admin'], isBottom: false },
                { id: 'pengaturan', title: 'Pengaturan Web', icon: 'fa-cogs', roles: ['admin'], isBottom: false },
                
                // Auth
                { id: 'auth', title: 'Login / Daftar', icon: 'fa-sign-in-alt', roles: ['guest'], isBottom: true },
            ];

            const filteredMenus = menus.filter(m => m.roles.includes(role));
            window.appState.visibleMenus = filteredMenus;
            
            // Sidebar Desktop
            let deskHTML = `<ul class="space-y-1.5">`;
            filteredMenus.forEach(m => {
                const active = window.appState.currentView === m.id ? 'bg-primary text-white font-bold shadow-md' : 'text-slate-600 hover:bg-rose-100 hover:text-primary font-medium';
                deskHTML += `
                    <li>
                        <button onclick="window.navigateTo('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all ${active}">
                            <i class="fas ${m.icon} w-5 text-center text-lg"></i><span class="text-sm">${m.title}</span>${menuBadge(m.id)}
                        </button>
                    </li>
                `;
            });
            if(role !== 'guest') {
                deskHTML += `
                    <li>
                        <button onclick="window.handleLogout()" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-500 border border-slate-300 hover:bg-slate-100 hover:text-slate-700 transition-all mt-6 font-bold">
                            <i class="fas fa-sign-out-alt w-5 text-center text-lg"></i><span class="text-sm">Keluar Akun</span>
                        </button>
                    </li>
                `;
            }
            deskHTML += `</ul>`;
            document.getElementById('desktop-menu-container').innerHTML = deskHTML;

            // Bottom Nav Mobile
            let bottomItems = filteredMenus.filter(m => m.isBottom).slice(0, 4);
            let bottomHTML = '';
            bottomItems.forEach(m => {
                 const active = window.appState.currentView === m.id ? 'text-primary scale-110' : 'text-slate-400';
                 bottomHTML += `
                    <button onclick="window.navigateTo('${m.id}')" class="flex flex-col items-center justify-center p-2 w-16 transition-all duration-300 ${active}">
                        <i class="fas ${m.icon} text-2xl mb-1 ${window.appState.currentView === m.id ? 'drop-shadow-md' : ''}"></i>
                        <span class="text-[10px] leading-tight text-center font-semibold whitespace-nowrap">${m.title}</span>
                    </button>
                 `;
            });
            if(filteredMenus.length > 4) {
                 bottomHTML += `
                    <button onclick="window.toggleMobileMenu()" class="flex flex-col items-center justify-center p-2 w-16 text-slate-400 hover:text-primary transition-all duration-300">
                        <i class="fas fa-bars text-2xl mb-1"></i><span class="text-[10px] leading-tight text-center font-semibold">Lainnya</span>
                    </button>
                 `;
            }
            document.getElementById('bottom-nav').innerHTML = bottomHTML;

            // User Info
            document.getElementById('desktop-user-info').innerHTML = role === 'guest' ? `<div class="text-sm text-center text-slate-500 font-medium"><i class="fas fa-user-secret mr-1"></i> Mode Pengunjung</div>` : `
                <div class="flex items-center gap-3 w-full bg-white p-2 rounded-xl shadow-sm border border-rose-100">

            if (!isValidDrive) {

            }

            try {
                await addDoc(getCol('karya'), {
                    id_user: window.appState.user.id, nama_pembuat: window.appState.user.nama,
                    kategori_karya: document.getElementById('uk-kategori').value, judul: document.getElementById('uk-judul').value,
                    deskripsi: document.getElementById('uk-deskripsi').value, link_file: link, timestamp: Date.now()

                window.showModal("Sukses", "Karya inovasi Anda berhasil dipublikasikan ke Galeri.");

            if(tab === 'login') {

        window.handleLogin = async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;

            // Jika menggunakan Email, verifikasi via Firebase Auth (Untuk Admin)
            if(u.includes('@')) {
                try {
                    await signInWithEmailAndPassword(auth, u, p);
                    window.appState.role = 'admin'; window.appState.user = { nama: "Pengawas (Admin)" };
                    window.navigateTo('pantau_karya');
                    setTimeout(()=> window.showModal("Berhasil", "Selamat datang di Dasbor Admin."), 300);
                    return;
                } catch(err) { return window.showModal("Login Gagal", "Kredensial Admin tidak valid.", true); }
            }

            // Jika tanpa Email, verifikasi via koleksi 'users' (Untuk Peserta/Guru/Siswa)
            try {
                const snap = await getDocs(getCol('users'));
                let foundUser = null; let userId = null;
                snap.forEach(doc => { if(doc.data().username === u && doc.data().password === p) { foundUser = doc.data(); userId = doc.id; } });

                if(foundUser) {
                    window.appState.role = 'user'; window.appState.user = { id: userId, ...foundUser };
                    window.navigateTo('beranda');
                } else { window.showModal("Akses Ditolak", "Username atau password salah. Silakan coba lagi.", true); }
            } catch(err) { window.showModal("Error", "Gagal memproses login.", true); }
        };

        window.handleRegister = async (e) => {
            e.preventDefault();
            const usr = document.getElementById('reg-user').value.trim().toLowerCase();
            try {
                const snap = await getDocs(getCol('users'));
                let isExist = false;
                snap.forEach(doc => { if(doc.data().username.toLowerCase() === usr) isExist = true; });

                if(isExist) return window.showModal("Gagal", "Username tersebut sudah digunakan orang lain. Gunakan yang lain.", true);

                await addDoc(getCol('users'), {
                    kategori: document.getElementById('reg-kategori').value,
                    nama: document.getElementById('reg-nama').value,
                    sekolah: document.getElementById('reg-sekolah').value,
                    username: usr, password: document.getElementById('reg-pass').value,
                    foto_profil: "", nip: "", timestamp: Date.now()
                });
                
                window.showModal("Pendaftaran Berhasil", "Akun Anda telah selesai dibuat. Silakan login menggunakan Username dan Password barusan.");

                    const key = map[col];
                    if(key) window.appState[key] = window.appState[key].filter(x => x.id !== id);

                if(redirectView && redirectView !== 'null') window.navigateTo(redirectView);

            diskusiList.slice(-150).forEach(m => {
                const mine = myId && m.id_user === myId;
                const isPengawas = m.kategori === 'pengawas';
                const canDelete = mine || role === 'admin';
                const badge = KATEGORI_LABEL[m.kategori] || 'Anggota';

                    </div>

            const input = document.getElementById('diskusi-input');
            const isi = input.value.trim();
            if(!isi) return;

            const data = {
                id_user: role === 'admin' ? 'admin' : user.id,
                nama: role === 'admin' ? window.appState.pengawas.nama : user.nama,
                kategori: role === 'admin' ? 'pengawas' : (user.kategori || 'guru'),
                isi, timestamp: Date.now()
            };
            const btn = document.getElementById('diskusi-send');
            btn.disabled = true;
            try {
                if(window.appState.liveDb) {
                    await addDoc(getCol('diskusi'), data);   // listener realtime akan merender ulang

                    window.appState.diskusiList.push({ id: 'local_' + Date.now(), ...data });

                window.showModal("Gagal Mengirim", "Pesan tidak terkirim. Periksa koneksi internet atau aturan (Security Rules) Firestore Anda.", true);

            };

        window.gantiPasswordSendiri = async (e) => {

            const u = window.appState.user;
            const lama = document.getElementById('pw-lama').value;
            const baru = document.getElementById('pw-baru').value;
            const konf = document.getElementById('pw-konfirmasi').value;

            if(lama !== u.password) return window.showModal("Password Lama Salah", "Password lama yang Anda masukkan tidak sesuai.", true);
            if(baru.length < 4) return window.showModal("Terlalu Pendek", "Password baru minimal 4 karakter.", true);
            if(baru !== konf) return window.showModal("Tidak Cocok", "Konfirmasi password baru tidak sama.", true);
            if(baru === lama) return window.showModal("Tidak Berubah", "Password baru harus berbeda dari password lama.", true);

            try {
                await updateDoc(getDocRef('users', u.id), { password: baru });
                window.appState.user = { ...u, password: baru };
                ['pw-lama','pw-baru','pw-konfirmasi'].forEach(id => document.getElementById(id).value = '');

            const b = document.getElementById('ki-batal'); if(b) b.classList.add('hidden');
            const s = document.getElementById('ki-submit'); if(s) s.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Publikasikan';

        window.editInformasi = (id) => {
            const info = window.appState.informasiList.find(i => i.id === id);

            document.getElementById('ki-judul').value = info.judul || '';
            document.getElementById('ki-isi').value = info.isi || '';
            document.getElementById('ki-gambar').value = info.link_gambar || '';
            document.getElementById('ki-form-title').innerHTML = '<i class="fas fa-pen text-amber-600 mr-2"></i> Edit Informasi';
            document.getElementById('ki-batal').classList.remove('hidden');
            document.getElementById('ki-submit').innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Perubahan';
            document.getElementById('ki-form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.getElementById('ki-judul').focus();
        };

        window.batalEditInformasi = () => resetFormInformasi();

        window.simpanInformasi = async (e) => {
            e.preventDefault();
            const id = document.getElementById('ki-id').value;
            const judul = document.getElementById('ki-judul').value.trim();
            const isi = document.getElementById('ki-isi').value.trim();
            const gambar = document.getElementById('ki-gambar').value.trim();
            if(!judul || !isi) return window.showModal("Data Belum Lengkap", "Judul dan isi informasi wajib diisi.", true);
            if(gambar && !/^https?:\/\//i.test(gambar)) return window.showModal("URL Tidak Valid", "URL gambar harus diawali http:// atau https://", true);

            const btn = document.getElementById('ki-submit'); btn.disabled = true;
            try {
                if(id) {
                    await dbUpdate('informasi', 'informasiList', id, { judul, isi, link_gambar: gambar, diedit: Date.now() });
                    window.showModal("Tersimpan", "Informasi berhasil diperbarui.");
                } else {
                    await dbAdd('informasi', 'informasiList', { judul, isi, link_gambar: gambar, timestamp: Date.now() });
                    window.showModal("Terpublikasi", "Informasi baru berhasil dipublikasikan dan langsung tampil di menu Informasi.");
                }
                resetFormInformasi();
            } catch(err) {
                window.showModal("Gagal", "Informasi tidak dapat disimpan. Pastikan Anda login sebagai admin dan Security Rules Firestore mengizinkan tulis.", true);
            } finally { btn.disabled = false; }
        };

        function renderDashAll() { renderDashStats(); renderDashTabs(); renderDashTable(); }

        function renderDashStats() {
            const el = document.getElementById('dash-stats'); if(!el) return;
            const { karyaList, raporList, pesanList, dash } = window.appState;
            const unread = pesanList.filter(p => !p.dibaca).length;
            const card = (icon, color, val, label, onclick = '') => `
                <div ${onclick ? `onclick="${onclick}"` : ''} class="glass-card bg-white p-5 text-center border-t-4 ${color} ${onclick ? 'cursor-pointer hover:-translate-y-1 transition-transform' : ''}">
                    <div class="text-2xl mb-2 text-slate-400"><i class="fas ${icon}"></i></div>
                    <div class="text-3xl font-black text-slate-800 leading-none mb-1">${val}</div>
                    <div class="text-[10px] md:text-xs text-slate-500 font-bold uppercase tracking-widest">${label}</div>
                </div>`;
            const counts = KATEGORI_KARYA.map(k => ({ k, n: karyaList.filter(x => x.kategori_karya === k).length }));
            const max = Math.max(1, ...counts.map(x => x.n));
            const bars = counts.map(x => `
                <div class="flex items-center gap-3 text-xs">
                    <div class="w-40 md:w-48 shrink-0 font-semibold text-slate-600 truncate">${x.k}</div>
                    <div class="flex-1 bg-rose-50 rounded-full h-3 overflow-hidden"><div class="h-3 bg-gradient-to-r from-secondary to-primary rounded-full transition-all" style="width:${(x.n / max) * 100}%"></div></div>
                    <div class="w-8 text-right font-black text-slate-700">${x.n}</div>
                </div>`).join('');
            el.innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    ${card('fa-file-invoice', 'border-t-secondary', karyaList.length, 'Total Karya')}

                    ${card('fa-file-signature', 'border-t-green-500', raporList.length, 'Rapor Masuk')}

        function renderDashTabs() {
            const el = document.getElementById('dash-tabs'); if(!el) return;

        function renderDashTable() {
            const el = document.getElementById('dash-table'); if(!el) return;
            const { tab, q, kat } = window.appState.dash;
            const term = (q || '').toLowerCase().trim();
            const has = (...f) => !term || f.some(x => String(x || '').toLowerCase().includes(term));
            const th = 'p-4 font-black text-xs uppercase tracking-wider';
            let html = '';

            if(tab === 'karya') {
                const rows = window.appState.karyaList.filter(k => (kat === 'Semua' || k.kategori_karya === kat) && has(k.judul, k.nama_pembuat, k.deskripsi))

                if(!rows.length) html += `<tr><td colspan="5" class="p-10 text-center text-slate-500 font-medium">Tidak ada data karya.</td></tr>`;
                rows.forEach(k => {
                    html += `<tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors align-top">
                        <td class="p-4 min-w-[220px]"><div class="font-bold text-slate-800">${esc(k.judul)}</div><div class="text-xs text-slate-500 line-clamp-2 mt-0.5">${esc(k.deskripsi)}</div></td>

                        <td class="p-4 text-sm font-semibold text-slate-700">${esc(k.nama_pembuat)}</td>
                        <td class="p-4 text-xs text-slate-500 whitespace-nowrap">${formatDate(k.timestamp)}</td>
                        <td class="p-4 text-center whitespace-nowrap space-x-1">
                            <a href="${safeUrl(k.link_file)}" target="_blank" rel="noopener" class="inline-flex w-8 h-8 rounded bg-blue-100 text-blue-600 hover:bg-blue-200 items-center justify-center" title="Buka file"><i class="fas fa-external-link-alt"></i></a>
                            <button onclick="window.tampilkanKonfirmasiHapus('karya', '${esc(k.id)}', 'null')" class="w-8 h-8 rounded bg-red-100 text-red-600 hover:bg-red-200" title="Hapus"><i class="fas fa-trash"></i></button>
                        </td></tr>`;
                });
            } else {
                const rows = window.appState.raporList.filter(r => has(r.nama_pengunggah, r.asal_sekolah, r.tahun_ajaran, r.catatan));
                html = `<table class="w-full text-left border-collapse"><thead><tr class="bg-rose-50 text-slate-700 border-b border-rose-200">
                    <th class="${th}">Pengunggah</th><th class="${th}">Periode</th><th class="${th}">Catatan</th><th class="${th}">Tanggal</th><th class="${th} text-center">Aksi</th></tr></thead><tbody>`;
                if(!rows.length) html += `<tr><td colspan="5" class="p-10 text-center text-slate-500 font-medium">Belum ada rapor yang masuk.</td></tr>`;
                rows.forEach(r => {
                    html += `<tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors align-top">
                        <td class="p-4 min-w-[180px]"><div class="font-bold text-slate-800">${esc(r.nama_pengunggah)}</div><div class="text-xs text-slate-500">${esc(r.asal_sekolah || '-')}</div></td>
                        <td class="p-4 text-sm font-semibold text-slate-700 whitespace-nowrap">${esc(r.tahun_ajaran)}</td>
                        <td class="p-4 text-sm text-slate-600 min-w-[200px] whitespace-pre-wrap">${esc(r.catatan || '-')}</td>
                        <td class="p-4 text-xs text-slate-500 whitespace-nowrap">${formatDate(r.timestamp)}</td>
                        <td class="p-4 text-center whitespace-nowrap space-x-1">
                            <a href="${safeUrl(r.link_rapor)}" target="_blank" rel="noopener" class="inline-flex w-8 h-8 rounded bg-blue-100 text-blue-600 hover:bg-blue-200 items-center justify-center" title="Buka rapor"><i class="fas fa-external-link-alt"></i></a>
                            <button onclick="window.tampilkanKonfirmasiHapus('rapor_pendidikan', '${esc(r.id)}', 'null')" class="w-8 h-8 rounded bg-red-100 text-red-600 hover:bg-red-200" title="Hapus"><i class="fas fa-trash"></i></button>
                        </td></tr>`;

        function kontakLink(kontak) {
            const k = (kontak || '').trim();
            if(!k) return '';
            if(k.includes('@')) return `<a href="mailto:${esc(k)}" class="px-4 py-2 rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200 text-sm font-bold"><i class="fas fa-envelope mr-1"></i> Balas Email</a>`;
            let d = k.replace(/\D/g, '');
            if(d.length < 9) return '';
            if(d.startsWith('0')) d = '62' + d.slice(1);
            return `<a href="https://wa.me/${d}" target="_blank" rel="noopener" class="px-4 py-2 rounded-lg bg-green-100 text-green-700 hover:bg-green-200 text-sm font-bold"><i class="fab fa-whatsapp mr-1"></i> Balas WhatsApp</a>`;
        }

            if(!list.length) { el.innerHTML = `<div class="text-center py-14 glass-card bg-white text-slate-500 font-bold"><i class="far fa-envelope-open text-5xl text-rose-200 mb-3"></i><br>Belum ada pesan masuk.</div>`; return; }
            el.innerHTML = list.map(p => `

                    </div>

                    <p class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed break-words mb-4">${esc(p.pesan)}</p>

                        <button onclick="window.tampilkanKonfirmasiHapus('pesan_pengawas', '${esc(p.id)}', 'null')" class="px-4 py-2 rounded-lg bg-red-100 text-red-600 hover:bg-red-200 text-sm font-bold"><i class="fas fa-trash mr-1"></i> Hapus</button>
                    </div>
                </div>`).join('');

        window.tandaiDibaca = async (id) => {
            try { await dbUpdate('pesan_pengawas', 'pesanList', id, { dibaca: true }); renderNavigation(); }
            catch(e) { window.showModal("Gagal", "Tidak dapat memperbarui pesan.", true); }
        };

        window.tandaiSemuaDibaca = async () => {
            const unread = window.appState.pesanList.filter(p => !p.dibaca);
            if(!unread.length) return;
            try { await Promise.all(unread.map(p => dbUpdate('pesan_pengawas', 'pesanList', p.id, { dibaca: true }))); renderNavigation(); }
            catch(e) { window.showModal("Gagal", "Tidak dapat memperbarui pesan.", true); }
        };

            const u = window.appState.user;
            if(!k || !u || k.id_user !== u.id) return;
            const opts = KATEGORI_KARYA.map(o => `<option value="${o}" ${o === k.kategori_karya ? 'selected' : ''}>${o}</option>`).join('');

            const html = `
                <div class="w-full text-left space-y-3 max-h-[55vh] overflow-y-auto px-1">

                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Judul</label><input type="text" id="ek-judul" value="${esc(k.judul)}" class="${cls}"></div>
                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Deskripsi</label><textarea id="ek-deskripsi" rows="4" class="${cls} resize-none">${esc(k.deskripsi)}</textarea></div>
                    <div><label class="block text-xs font-bold text-slate-700 mb-1">Link Google Drive</label><input type="url" id="ek-link" value="${esc(k.link_file)}" class="${cls} font-mono"></div>

                        <button onclick="window.closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold hover:bg-slate-300">Batal</button>
                        <button onclick="window.simpanEditKarya('${esc(id)}')" class="px-4 py-2 bg-primary text-white rounded-lg font-bold hover:bg-red-900 shadow-md">Simpan</button>

            window.showModal("Edit Karya", "", false, html);
            document.getElementById('modal-icon').innerHTML = '<i class="fas fa-pen text-amber-500"></i>';

        window.simpanEditKarya = async (id) => {
            const data = {
                kategori_karya: document.getElementById('ek-kategori').value,
                judul: document.getElementById('ek-judul').value.trim(),
                deskripsi: document.getElementById('ek-deskripsi').value.trim(),
                link_file: document.getElementById('ek-link').value.trim()
            };
            const err = document.getElementById('ek-error');
            if(!data.judul || !data.deskripsi) { err.textContent = "Judul dan deskripsi wajib diisi."; return; }
            if(!/^https?:\/\/(drive|docs)\.google\.com\//.test(data.link_file)) { err.textContent = "Link harus dari Google Drive / Google Docs."; return; }
            try {
                await dbUpdate('karya', 'karyaList', id, data);
                window.closeModal();
                setTimeout(() => window.showModal("Tersimpan", "Karya berhasil diperbarui."), 300);
            } catch(e) { err.textContent = "Gagal menyimpan. Periksa koneksi Anda."; }
        };

                    <div class="glass-card p-6 md:p-8 bg-white">
                        <form onsubmit="window.simpanProfilPengawas(event)" class="space-y-5">
                            <div class="flex flex-col items-center gap-3 pb-2">
                                <div id="pw-preview" class="w-32 h-32 rounded-full bg-rose-100 text-primary text-5xl flex items-center justify-center overflow-hidden border-4 border-white shadow-lg"></div>
                                <div class="flex flex-wrap gap-2 justify-center">
                                    <label class="cursor-pointer px-4 py-2 bg-primary text-white rounded-full text-sm font-bold hover:bg-red-900 shadow-md active:scale-95 transition-all">
                                        <i class="fas fa-camera mr-1"></i> Pilih Foto
                                        <input type="file" accept="image/*" class="hidden" onchange="window.pilihFotoPengawas(this)">
                                    </label>
                                    <button type="button" onclick="window.hapusFotoPengawas()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-full text-sm font-bold hover:bg-slate-200"><i class="fas fa-trash-alt mr-1"></i> Hapus Foto</button>
                                </div>
                                <p class="text-xs text-slate-500 text-center">Foto dari perangkat otomatis dikecilkan agar ringan. Atau tempel URL gambar di bawah.</p>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">URL Foto <span class="font-normal text-slate-400">- opsional</span></label>
                                <input type="url" id="pw-url" value="${isDataUrl ? '' : esc(pengawasFotoDraft)}" oninput="window.urlFotoPengawas(this.value)" placeholder="https://contoh.com/foto.jpg" class="${INPUT_CLS}">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Nama Lengkap & Gelar</label>
                                <input type="text" id="pw-nama" required maxlength="100" value="${esc(pw.nama)}" class="${INPUT_CLS}">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Jabatan</label>
                                <input type="text" id="pw-jabatan" required maxlength="120" value="${esc(pw.jabatan)}" class="${INPUT_CLS}">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">NIP <span class="font-normal text-slate-400">- opsional</span></label>
                                <input type="text" id="pw-nip" value="${esc(pw.nip || '')}" class="${INPUT_CLS} font-mono">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Kata Sambutan (tampil di Beranda)</label>
                                <textarea id="pw-kutipan" rows="5" maxlength="600" required class="${INPUT_CLS} resize-y">${esc(pw.kutipan)}</textarea>
                            </div>
                            <button type="submit" id="pw-submit" class="w-full bg-primary text-white py-4 rounded-xl font-black shadow-lg hover:bg-red-900 transition-colors active:scale-95"><i class="fas fa-save mr-2"></i> Simpan Profil Pengawas</button>
                        </form>
                    </div>
                </div>
            `;
            setTimeout(setPreviewPengawas, 0);
            return html;
        }

        function setPreviewPengawas() {
            const el = document.getElementById('pw-preview'); if(!el) return;
            el.innerHTML = pengawasFotoDraft
                ? `<img src="${esc(pengawasFotoDraft)}" class="w-full h-full object-cover" onerror="this.parentNode.innerHTML='<i class=&quot;fas fa-user-tie&quot;></i>'">`
                : '<i class="fas fa-user-tie"></i>';
        }

        window.urlFotoPengawas = (v) => { pengawasFotoDraft = v.trim(); setPreviewPengawas(); };

        window.hapusFotoPengawas = () => {
            pengawasFotoDraft = '';
            const u = document.getElementById('pw-url'); if(u) u.value = '';
            setPreviewPengawas();
        };

        window.pilihFotoPengawas = (input) => {
            const file = input.files && input.files[0];
            if(!file) return;
            if(!file.type.startsWith('image/')) return window.showModal("File Tidak Valid", "Pilih file gambar (JPG, PNG, dsb).", true);
            if(file.size > 8 * 1024 * 1024) return window.showModal("File Terlalu Besar", "Ukuran foto maksimal 8 MB.", true);
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    // Potong persegi dari tengah, kecilkan ke 320x320
                    const size = 320, c = document.createElement('canvas');
                    c.width = c.height = size;
                    const side = Math.min(img.width, img.height);
                    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
                    pengawasFotoDraft = c.toDataURL('image/jpeg', 0.85);
                    const u = document.getElementById('pw-url'); if(u) u.value = '';
                    setPreviewPengawas();
                };
                img.onerror = () => window.showModal("Gagal", "Gambar tidak dapat dibaca.", true);
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        };

        window.simpanProfilPengawas = async (e) => {
            e.preventDefault();
            const data = {
                nama: document.getElementById('pw-nama').value.trim(),
                jabatan: document.getElementById('pw-jabatan').value.trim(),
                nip: document.getElementById('pw-nip').value.trim(),
                kutipan: document.getElementById('pw-kutipan').value.trim(),
                foto_url: pengawasFotoDraft
            };
            if(!data.nama || !data.jabatan || !data.kutipan) return window.showModal("Data Belum Lengkap", "Nama, jabatan, dan kata sambutan wajib diisi.", true);
            if(data.foto_url && !/^(https?:\/\/|data:image\/)/i.test(data.foto_url)) return window.showModal("URL Tidak Valid", "URL foto harus diawali http:// atau https://", true);

            const btn = document.getElementById('pw-submit'); btn.disabled = true;
            try {
                if(window.appState.liveDb) await setDoc(getDocRef('pengaturan', 'data_pengawas'), { ...data, timestamp: Date.now() }, { merge: true });
                window.appState.pengawas = { ...window.appState.pengawas, ...data };
                renderNavigation();
                window.showModal("Tersimpan", "Profil pengawas berhasil diperbarui. Perubahan langsung tampil di Beranda, Sapa Pengawas, dan Ruang Diskusi.");
            } catch(err) {
                window.showModal("Gagal", "Profil tidak dapat disimpan. Pastikan Anda login sebagai admin dan Security Rules Firestore mengizinkan tulis ke koleksi pengaturan.", true);
            } finally { btn.disabled = false; }
        };

        // Start App
        window.onload = () => { initFirebaseAuth(); };

    </script>
</body>
</html>
