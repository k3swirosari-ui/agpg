<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Grobogan - Inovasi Pendidikan</title>
    
    <!-- PWA Manifest Placeholder -->
    <link rel="manifest" id="manifest-placeholder">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#991b1b', // Crimson Red / Maroon
                        secondary: '#ef4444', // Vibrant Red
                        accent: '#eab308', // Gold
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff1f2; color: #334155; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Glassmorphism Classes (Red Tint) */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(254, 226, 226, 0.5); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; border: 1px solid rgba(254, 202, 202, 0.4); box-shadow: 0 4px 6px -1px rgba(153, 27, 27, 0.05), 0 2px 4px -1px rgba(153, 27, 27, 0.03); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffe4e6; }
        ::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } 
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Layout Structure */
        #app-wrapper { display: flex; min-height: 100vh; flex-direction: column; }
        #main-content { flex: 1; padding-bottom: 5.5rem; transition: all 0.3s ease; }
        
        /* Safe area for iOS devices */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
            #main-content { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
        }
        
        @media (min-width: 768px) {
            #app-wrapper { flex-direction: row; }
            #main-content { padding-bottom: 0; margin-left: 16rem; }
            #bottom-nav { display: none; }
            #sidebar { display: flex; }
        }
        
        @media (max-width: 767px) {
            #sidebar { display: none; }
            #bottom-nav { display: flex; }
        }
        
        /* Transitions */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal Overlay */
        #modal-overlay { z-index: 10000; }
        
        /* App Branding Dinamis */
        .app-logo-bg { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffffff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'); background-size: 60%; background-repeat: no-repeat; background-position: center; }
    </style>
</head>
<body class="antialiased">

    <!-- UI Modal Custom (Pengganti Alert & Confirm) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center fade-in px-4">
        <div class="glass-card w-full max-w-md p-6 md:p-8 relative">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors">
                <i class="fas fa-times text-2xl"></i>
            </button>
            <div id="modal-icon" class="text-center text-5xl mb-4"></div>
            <h3 id="modal-title" class="text-xl font-bold text-center text-slate-800 mb-2"></h3>
            <p id="modal-message" class="text-center text-slate-600 mb-6 text-sm leading-relaxed"></p>
            <div class="flex justify-center gap-3" id="modal-actions">
                <button onclick="window.closeModal()" class="px-8 py-3 bg-primary text-white rounded-full font-bold hover:bg-red-900 transition-colors shadow-lg active:scale-95 w-full sm:w-auto">Tutup</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper">
        <!-- Sidebar Desktop -->
        <nav id="sidebar" class="w-64 glass h-screen fixed left-0 top-0 flex-col border-r border-rose-200 z-50">
            <div class="p-6 border-b border-rose-100 flex flex-col items-center">
                <div id="brand-logo-desktop" class="w-20 h-20 bg-gradient-to-tr from-primary to-secondary text-white rounded-2xl flex items-center justify-center shadow-lg mb-3 overflow-hidden app-logo-bg border-2 border-white"></div>
                <h1 id="brand-name-desktop" class="text-xl font-black text-slate-800 text-center leading-tight">Pintar Grobogan</h1>
                <p class="text-xs font-semibold text-secondary mt-1 text-center bg-red-50 px-3 py-1 rounded-full"><i class="fas fa-medal mr-1"></i> Inovasi Pendidikan</p>
            </div>
            <div class="flex-1 overflow-y-auto py-4 px-3 hide-scrollbar" id="desktop-menu-container">
                <!-- Menu dirender via JS -->
            </div>
            <div class="p-4 border-t border-rose-200 bg-rose-50/50" id="desktop-user-info">
                <!-- User info dirender via JS -->
            </div>
        </nav>

        <!-- Bottom Nav Mobile -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 w-full glass border-t border-rose-200 z-50 justify-around items-center px-1 py-2 pb-safe shadow-[0_-10px_15px_-3px_rgba(153,27,27,0.05)] bg-white/95">
            <!-- Menu dirender via JS -->
        </nav>

        <!-- Konten Utama -->
        <main id="main-content" class="w-full min-h-screen relative transition-all duration-300">
            <!-- Header Mobile -->
            <header class="md:hidden glass sticky top-0 z-40 px-4 py-3 border-b border-rose-200 flex justify-between items-center shadow-sm bg-white/90">
                <div class="flex items-center gap-3">
                    <div id="brand-logo-mobile" class="w-10 h-10 bg-gradient-to-tr from-primary to-secondary text-white rounded-xl flex items-center justify-center shadow-sm overflow-hidden app-logo-bg border border-white"></div>
                    <h1 id="brand-name-mobile" class="font-black text-lg text-slate-800 tracking-tight">Pintar Grobogan</h1>
                </div>
                <div id="mobile-header-user"></div>
            </header>

            <!-- Area View Dinamis -->
            <div id="view-container" class="p-4 md:p-8 w-full max-w-6xl mx-auto">
                <!-- Loading Spinner Default -->
                <div class="flex flex-col justify-center items-center h-64 gap-4">
                    <div class="w-12 h-12 border-4 border-rose-200 border-t-primary rounded-full animate-spin"></div>
                    <p class="text-primary font-semibold animate-pulse">Memuat Sistem Inovasi...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. KONFIGURASI FIREBASE ANDA
        // ==========================================
        // Ganti nilai-nilai di bawah ini dengan Firebase Config dari Console Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyUntukPreviewSaja",
            authDomain: "pintar-grobogan.firebaseapp.com",
            projectId: "pintar-grobogan",
            storageBucket: "pintar-grobogan.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };
        const appId = 'pintar-grobogan-app';

        // Initialize Firebase
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State Aplikasi Inti
        window.appState = {
            user: null, 
            role: 'guest', // 'guest', 'user', 'admin'
            currentView: 'beranda',
            karyaList: [],
            informasiList: [],
            pengaturan: { nama_aplikasi: 'Pintar Grobogan', logo_url: '' },
            dbReady: false
        };

        // Helper Path Firestore (Serverless Architecture)
        const getCol = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        // --- SISTEM MODAL & UI HELPERS (Pengganti Alert/Confirm) ---
        window.showModal = (title, message, isError = false, customActionsHtml = null) => {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message; 
            
            const icon = document.getElementById('modal-icon');
            if (isError) icon.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500 drop-shadow-md"></i>';
            else icon.innerHTML = '<i class="fas fa-check-circle text-green-500 drop-shadow-md"></i>';
            
            const actions = document.getElementById('modal-actions');
            if(customActionsHtml) {
                actions.innerHTML = customActionsHtml;
            } else {
                actions.innerHTML = `<button onclick="window.closeModal()" class="px-8 py-3 bg-primary text-white rounded-full font-bold hover:bg-red-900 transition-colors shadow-lg active:scale-95 w-full sm:w-auto">Tutup</button>`;
            }
            
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        const formatDate = (timestamp) => {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        };

        // Update Identitas Web Berdasarkan Pengaturan Database Admin
        function updateAppIdentity() {
            const nama = window.appState.pengaturan.nama_aplikasi || 'Pintar Grobogan';
            const logo = window.appState.pengaturan.logo_url;
            
            document.title = `${nama} - Inovasi Pendidikan`;
            document.getElementById('brand-name-desktop').textContent = nama;
            document.getElementById('brand-name-mobile').textContent = nama;

            const updateLogo = (id) => {
                const el = document.getElementById(id);
                if(el) {
                    if(logo) { 
                        el.innerHTML = `<img src="${logo}" class="w-full h-full object-cover">`; 
                        el.classList.remove('app-logo-bg'); 
                    } else { 
                        el.innerHTML = ''; 
                        el.classList.add('app-logo-bg'); 
                    }
                }
            };
            updateLogo('brand-logo-desktop');
            updateLogo('brand-logo-mobile');
            renderNavigation(); 
        }

        // --- SISTEM AWAL (DATABASE & AUTH) ---
        async function initFirebaseAuth() {
            try {
                const isDummy = firebaseConfig.apiKey.includes("DummyKey");
                if (!isDummy) await signInAnonymously(auth);
                
                if (!isDummy) await autoSetupDatabase();
                else {
                    window.appState.pengaturan = { nama_aplikasi: 'Pintar Grobogan (Preview Offline)', logo_url: '' };
                    updateAppIdentity();
                    fallbackOfflineData();
                    bukaTampilanAwal();
                }
            } catch (error) {
                console.warn("Koneksi Firebase ditolak. Menjalankan mode Fallback.");
                fallbackOfflineData();
                bukaTampilanAwal();
            }
        }

        function fallbackOfflineData() {
            window.appState.karyaList = [
                { id: '1', id_user: "dummy_id", nama_pembuat: "Budi Santoso, S.Pd", kategori_karya: "Modul Ajar", judul: "Modul Ajar Interaktif IPA Kelas 8", deskripsi: "Modul ajar digital terintegrasi materi Sistem Pencernaan.", link_file: "https://drive.google.com/file/d/xxx", timestamp: Date.now() }
            ];
            window.appState.informasiList = [
                { id: '1', judul: "Selamat Datang di Pintar Grobogan", isi: "Platform inovasi guru, siswa, dan kepala sekolah. (Mode Offline Preview)", timestamp: Date.now() }
            ];
        }

        function bukaTampilanAwal() {
            window.appState.dbReady = true;
            renderNavigation();
            window.navigateTo('beranda');
        }

        async function autoSetupDatabase() {
            try {
                // Setup Pengaturan if missing
                const setSnap = await getDocs(getCol('pengaturan'));
                if (setSnap.empty) {
                    await setDoc(getDocRef('pengaturan', 'app_settings'), { nama_aplikasi: "Pintar Grobogan", logo_url: "", timestamp: Date.now() });
                }

                const usersSnap = await getDocs(getCol('users'));
                if (usersSnap.empty) {
                    console.log("Menyiapkan struktur awal database...");
                    // Inject Dummy Data First Time
                    await addDoc(getCol('users'), { username: "guru123", password: "password123", nama: "Budi Santoso, S.Pd", kategori: "guru", sekolah: "SMPN 1 Purwodadi", foto_profil: "", nip: "198001012005011001", timestamp: Date.now() });
                    await addDoc(getCol('karya'), { id_user: "dummy_id", nama_pembuat: "Budi Santoso, S.Pd", kategori_karya: "Modul Ajar", judul: "Modul Ajar Interaktif IPA Berbasis Masalah", deskripsi: "Modul terintegrasi yang memudahkan siswa memahami IPA.", link_file: "https://drive.google.com/file/d/dummy", timestamp: Date.now() });
                    await addDoc(getCol('informasi'), { judul: "Selamat Datang di Portal Inovasi", isi: "Mari membagikan karya inovasi Anda di sini. Ini adalah langkah awal ekosistem pendidikan cerdas di Kabupaten Grobogan.", timestamp: Date.now() });
                }
                startDataListeners();
                bukaTampilanAwal();
            } catch (error) {
                console.warn("Mode Fallback (No Write Access) - Cek Security Rules Firebase Anda.");
                fallbackOfflineData();
                bukaTampilanAwal();
            }
        }

        let unsubs = [];
        function startDataListeners() {
            unsubs.forEach(unsub => unsub()); unsubs = [];
            try {
                unsubs.push(onSnapshot(getDocRef('pengaturan', 'app_settings'), (docSnap) => {
                    if (docSnap.exists()) {
                        window.appState.pengaturan = docSnap.data();
                        updateAppIdentity();
                    }
                }));

                unsubs.push(onSnapshot(getCol('karya'), (snapshot) => {
                    window.appState.karyaList = [];
                    snapshot.forEach(doc => window.appState.karyaList.push({ id: doc.id, ...doc.data() }));
                    const v = window.appState.currentView;
                    if(['galeri', 'beranda', 'pantau_karya', 'karya_saya'].includes(v)) renderCurrentView();
                }));

                unsubs.push(onSnapshot(getCol('informasi'), (snapshot) => {
                    window.appState.informasiList = [];
                    snapshot.forEach(doc => window.appState.informasiList.push({ id: doc.id, ...doc.data() }));
                    window.appState.informasiList.sort((a,b) => b.timestamp - a.timestamp);
                    const v = window.appState.currentView;
                    if(['informasi', 'kelola_informasi'].includes(v)) renderCurrentView();
                }));
            } catch(e) {}
        }

        // --- NAVIGASI & MENU ---
        window.navigateTo = (view) => {
            window.appState.currentView = view;
            renderNavigation();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function renderNavigation() {
            const role = window.appState.role;
            const menus = [
                // Publik
                { id: 'beranda', title: 'Beranda', icon: 'fa-home', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'galeri', title: 'Galeri', icon: 'fa-images', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'informasi', title: 'Informasi', icon: 'fa-bullhorn', roles: ['guest', 'user', 'admin'], isBottom: true },
                { id: 'diskusi', title: 'Diskusi', icon: 'fa-comments', roles: ['guest', 'user', 'admin'], isBottom: false },
                { id: 'sapa', title: 'Sapa Pengawas', icon: 'fa-envelope-open-text', roles: ['guest', 'user'], isBottom: false },
                
                // User (Guru/Siswa/Kepsek)
                { id: 'profil', title: 'Profil Saya', icon: 'fa-id-card', roles: ['user'], isBottom: true },
                { id: 'unggah_karya', title: 'Unggah Karya', icon: 'fa-cloud-upload-alt', roles: ['user'], isBottom: false },
                { id: 'unggah_rapor', title: 'Rapor Digital', icon: 'fa-file-signature', roles: ['user'], isBottom: false },
                { id: 'karya_saya', title: 'Karya Saya', icon: 'fa-folder-open', roles: ['user'], isBottom: false },
                
                // Admin (Pengawas)
                { id: 'pantau_karya', title: 'Dasbor Data', icon: 'fa-chart-pie', roles: ['admin'], isBottom: true },
                { id: 'kelola_pengguna', title: 'Pengguna', icon: 'fa-users-cog', roles: ['admin'], isBottom: false },
                { id: 'kelola_informasi', title: 'Kelola Info', icon: 'fa-edit', roles: ['admin'], isBottom: false },
                { id: 'kotak_masuk', title: 'Pesan Masuk', icon: 'fa-inbox', roles: ['admin'], isBottom: false },
                { id: 'pengaturan', title: 'Pengaturan Web', icon: 'fa-cogs', roles: ['admin'], isBottom: false },
                
                // Auth
                { id: 'auth', title: 'Login / Daftar', icon: 'fa-sign-in-alt', roles: ['guest'], isBottom: true },
            ];

            const filteredMenus = menus.filter(m => m.roles.includes(role));
            
            // Sidebar Desktop
            let deskHTML = `<ul class="space-y-1.5">`;
            filteredMenus.forEach(m => {
                const active = window.appState.currentView === m.id ? 'bg-primary text-white font-bold shadow-md' : 'text-slate-600 hover:bg-rose-100 hover:text-primary font-medium';
                deskHTML += `
                    <li>
                        <button onclick="window.navigateTo('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all ${active}">
                            <i class="fas ${m.icon} w-5 text-center text-lg"></i><span class="text-sm">${m.title}</span>
                        </button>
                    </li>
                `;
            });
            if(role !== 'guest') {
                deskHTML += `
                    <li>
                        <button onclick="window.handleLogout()" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-500 border border-slate-300 hover:bg-slate-100 hover:text-slate-700 transition-all mt-6 font-bold">
                            <i class="fas fa-sign-out-alt w-5 text-center text-lg"></i><span class="text-sm">Keluar Akun</span>
                        </button>
                    </li>
                `;
            }
            deskHTML += `</ul>`;
            document.getElementById('desktop-menu-container').innerHTML = deskHTML;

            // Bottom Nav Mobile
            let bottomItems = filteredMenus.filter(m => m.isBottom).slice(0, 4);
            let bottomHTML = '';
            bottomItems.forEach(m => {
                 const active = window.appState.currentView === m.id ? 'text-primary scale-110' : 'text-slate-400';
                 bottomHTML += `
                    <button onclick="window.navigateTo('${m.id}')" class="flex flex-col items-center justify-center p-2 w-16 transition-all duration-300 ${active}">
                        <i class="fas ${m.icon} text-2xl mb-1 ${window.appState.currentView === m.id ? 'drop-shadow-md' : ''}"></i>
                        <span class="text-[10px] leading-tight text-center font-semibold whitespace-nowrap">${m.title}</span>
                    </button>
                 `;
            });
            if(filteredMenus.length > 4) {
                 bottomHTML += `
                    <button onclick="window.toggleMobileMenu()" class="flex flex-col items-center justify-center p-2 w-16 text-slate-400 hover:text-primary transition-all duration-300">
                        <i class="fas fa-bars text-2xl mb-1"></i><span class="text-[10px] leading-tight text-center font-semibold">Lainnya</span>
                    </button>
                 `;
            }
            document.getElementById('bottom-nav').innerHTML = bottomHTML;

            // User Info
            document.getElementById('desktop-user-info').innerHTML = role === 'guest' ? `<div class="text-sm text-center text-slate-500 font-medium"><i class="fas fa-user-secret mr-1"></i> Mode Pengunjung</div>` : `
                <div class="flex items-center gap-3 w-full bg-white p-2 rounded-xl shadow-sm border border-rose-100">
                    <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-primary font-bold overflow-hidden border-2 border-white shadow-sm shrink-0">
                        ${window.appState.user?.foto_profil ? `<img src="${window.appState.user.foto_profil}" class="w-full h-full object-cover">` : '<i class="fas fa-user"></i>'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-slate-800 truncate">${window.appState.user?.nama || 'Admin Sistem'}</p>
                        <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider">${window.appState.role === 'admin' ? 'Pengawas' : window.appState.user?.kategori}</p>
                    </div>
                </div>
            `;
            document.getElementById('mobile-header-user').innerHTML = role !== 'guest' ? `<button onclick="window.handleLogout()" class="w-10 h-10 rounded-full bg-rose-100 text-primary flex items-center justify-center text-sm shadow-sm border border-rose-200"><i class="fas fa-sign-out-alt"></i></button>` : '';
        }

        window.toggleMobileMenu = () => {
            const role = window.appState.role;
            if(role === 'admin') window.navigateTo('pantau_karya');
            else if(role === 'user') window.navigateTo('profil');
            else window.navigateTo('sapa');
        }

        function renderCurrentView() {
            const container = document.getElementById('view-container');
            container.innerHTML = ''; 
            
            const v = window.appState.currentView;
            if(v === 'beranda') container.innerHTML = viewBeranda();
            else if(v === 'galeri') container.innerHTML = viewGaleri();
            else if(v === 'informasi') container.innerHTML = viewInformasi();
            else if(v === 'diskusi') viewDiskusi(container);
            else if(v === 'sapa') container.innerHTML = viewSapa();
            else if(v === 'auth') container.innerHTML = viewAuth();
            
            else if(v === 'profil') container.innerHTML = viewProfil();
            else if(v === 'unggah_karya') container.innerHTML = viewUnggahKarya();
            else if(v === 'unggah_rapor') container.innerHTML = viewUnggahRapor();
            else if(v === 'karya_saya') container.innerHTML = viewKaryaSaya();
            
            else if(v === 'kelola_informasi') container.innerHTML = viewKelolaInformasi();
            else if(v === 'pantau_karya') viewPantauKarya(container);
            else if(v === 'kotak_masuk') viewKotakMasuk(container);
            else if(v === 'kelola_pengguna') viewKelolaPengguna(container);
            else if(v === 'pengaturan') container.innerHTML = viewPengaturan();
            
            else container.innerHTML = `<div class="text-center p-10 text-gray-500"><i class="fas fa-search mb-2 text-3xl"></i><br>Halaman tidak ditemukan.</div>`;
        }

        function viewBeranda() {
            const statKarya = window.appState.karyaList.length;
            const latestKarya = window.appState.karyaList.slice(-3).reverse();
            const appName = window.appState.pengaturan.nama_aplikasi;

            let latestHtml = '';
            latestKarya.forEach(k => {
                let iconClass = 'fa-file-alt';
                if(k.kategori_karya.includes('Digital')) iconClass = 'fa-laptop-code';
                if(k.kategori_karya.includes('Modul')) iconClass = 'fa-book-open';
                
                latestHtml += `

                            </div>

                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2"><i class="fas fa-key text-slate-400 w-5"></i> Password</label>
                                <input type="password" id="login-pass" required class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-shadow bg-slate-50 text-sm">
                            </div>
                            <div class="pt-4">
                                <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-black hover:bg-red-900 transition-all shadow-lg active:scale-95 text-sm md:text-base tracking-wide"><i class="fas fa-sign-in-alt mr-2"></i> MASUK KE SISTEM</button>
                            </div>
                        </form>
                        
                        <form id="form-register" onsubmit="window.handleRegister(event)" class="space-y-5 hidden">
                            <div>
                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2">Daftar Sebagai</label>
                                <select id="reg-kategori" class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm bg-slate-50">
                                    <option value="guru">Guru</option>
                                    <option value="kepala_sekolah">Kepala Sekolah</option>
                                    <option value="siswa">Siswa</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2">Nama Lengkap & Gelar</label>
                                <input type="text" id="reg-nama" required class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2">Asal Sekolah</label>
                                <input type="text" id="reg-sekolah" required class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2">Buat Username (Untuk Login)</label>
                                <input type="text" id="reg-user" required class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm bg-slate-50 font-mono">
                            </div>
                            <div>
                                <label class="block text-xs md:text-sm font-bold text-slate-700 mb-2">Buat Password</label>
                                <input type="password" id="reg-pass" required minlength="4" class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-sm bg-slate-50 font-mono">
                            </div>
                            <div class="pt-4">
                                <button type="submit" class="w-full bg-accent text-slate-900 py-4 rounded-xl font-black hover:bg-yellow-500 transition-all shadow-[0_4px_15px_rgba(234,179,8,0.4)] active:scale-95 text-sm md:text-base"><i class="fas fa-user-plus mr-2"></i> BUAT AKUN SEKARANG</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.switchAuthTab = (tab) => {
            const fLogin = document.getElementById('form-login'), fReg = document.getElementById('form-register');
            const tLogin = document.getElementById('tab-login'), tReg = document.getElementById('tab-register');

            if(tab === 'login') {
                fLogin.classList.remove('hidden'); fReg.classList.add('hidden');
                tLogin.className = "flex-1 py-3.5 text-center font-black text-primary border-b-2 border-primary transition-all bg-white";
                tReg.className = "flex-1 py-3.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all";
            } else {
                fReg.classList.remove('hidden'); fLogin.classList.add('hidden');
                tReg.className = "flex-1 py-3.5 text-center font-black text-primary border-b-2 border-primary transition-all bg-white";
                tLogin.className = "flex-1 py-3.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all";
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;

            // Jika menggunakan Email, verifikasi via Firebase Auth (Untuk Admin)
            if(u.includes('@')) {
                try {
                    await signInWithEmailAndPassword(auth, u, p);
                    window.appState.role = 'admin'; window.appState.user = { nama: "Pengawas (Admin)" };
                    window.navigateTo('pantau_karya');
                    setTimeout(()=> window.showModal("Berhasil", "Selamat datang di Dasbor Admin."), 300);
                    return;
                } catch(err) { return window.showModal("Login Gagal", "Kredensial Admin tidak valid.", true); }
            }

            // Jika tanpa Email, verifikasi via koleksi 'users' (Untuk Peserta/Guru/Siswa)
            try {
                const snap = await getDocs(getCol('users'));
                let foundUser = null; let userId = null;
                snap.forEach(doc => { if(doc.data().username === u && doc.data().password === p) { foundUser = doc.data(); userId = doc.id; } });

                if(foundUser) {
                    window.appState.role = 'user'; window.appState.user = { id: userId, ...foundUser };
                    window.navigateTo('beranda');
                } else { window.showModal("Akses Ditolak", "Username atau password salah. Silakan coba lagi.", true); }
            } catch(err) { window.showModal("Error", "Gagal memproses login.", true); }
        };

        window.handleRegister = async (e) => {
            e.preventDefault();
            const usr = document.getElementById('reg-user').value.trim().toLowerCase();
            try {
                const snap = await getDocs(getCol('users'));
                let isExist = false;
                snap.forEach(doc => { if(doc.data().username.toLowerCase() === usr) isExist = true; });

                if(isExist) return window.showModal("Gagal", "Username tersebut sudah digunakan orang lain. Gunakan yang lain.", true);

                await addDoc(getCol('users'), {
                    kategori: document.getElementById('reg-kategori').value,
                    nama: document.getElementById('reg-nama').value,
                    sekolah: document.getElementById('reg-sekolah').value,
                    username: usr, password: document.getElementById('reg-pass').value,
                    foto_profil: "", nip: "", timestamp: Date.now()
                });
                
                window.showModal("Pendaftaran Berhasil", "Akun Anda telah selesai dibuat. Silakan login menggunakan Username dan Password barusan.");
                window.switchAuthTab('login');
                document.getElementById('login-user').value = usr;
                document.getElementById('login-pass').value = '';
            } catch(err) { window.showModal("Error", "Gagal mendaftar.", true); }
        };

        window.handleLogout = () => {
            if(window.appState.role === 'admin') signOut(auth).then(() => signInAnonymously(auth)); 
            window.appState.role = 'guest'; window.appState.user = null;
            window.navigateTo('beranda');
        };

        async function viewKelolaPengguna(container) {
            container.innerHTML = `<div class="text-center py-20"><div class="w-10 h-10 border-4 border-rose-200 border-t-primary rounded-full animate-spin mx-auto mb-4"></div><p class="font-bold text-primary">Memuat Data Pengguna...</p></div>`;
            try {
                const snap = await getDocs(getCol('users'));
                let html = `
                <div class="fade-in max-w-5xl mx-auto pb-10">
                    <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center"><i class="fas fa-users-cog text-primary mr-3"></i> Kelola Pengguna</h2>
                    <div class="glass-card overflow-hidden bg-white shadow-md">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-rose-50 text-slate-700 text-sm border-b border-rose-200">
                                        <th class="p-4 font-black">Nama / Instansi</th>
                                        <th class="p-4 font-black">Username</th>
                                        <th class="p-4 font-black">Password</th>
                                        <th class="p-4 font-black text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                if (snap.empty) {
                    html += `<tr><td colspan="4" class="p-8 text-center text-slate-500 font-medium">Belum ada pengguna terdaftar.</td></tr>`;
                } else {
                    snap.forEach(doc => {
                        const u = doc.data();
                        html += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                <td class="p-4">
                                    <div class="font-bold text-slate-800">${u.nama}</div>
                                    <div class="text-xs text-slate-500 uppercase font-semibold">${u.kategori} • ${u.sekolah || '-'}</div>
                                </td>
                                <td class="p-4"><code class="bg-slate-100 px-2 py-1 rounded text-primary text-sm font-bold">${u.username}</code></td>
                                <td class="p-4 text-sm font-mono text-slate-600">${u.password}</td>
                                <td class="p-4 text-center space-x-2">
                                    <button onclick="window.promptGantiPassword('${doc.id}', '${u.username}')" class="w-8 h-8 rounded bg-amber-100 text-amber-700 hover:bg-amber-200 transition-colors tooltip" title="Ganti Password"><i class="fas fa-key"></i></button>
                                    <button onclick="window.tampilkanKonfirmasiHapus('users', '${doc.id}', 'kelola_pengguna')" class="w-8 h-8 rounded bg-red-100 text-red-600 hover:bg-red-200 transition-colors"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                html += `</tbody></table></div></div></div>`;
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10 font-bold"><i class="fas fa-exclamation-triangle text-3xl mb-3"></i><br>Gagal memuat data.</div>`;
            }
        }

        window.promptGantiPassword = (id, username) => {
            const html = `
                <div class="mt-4 space-y-4 text-left">
                    <p class="text-sm font-semibold text-slate-700">Setel password baru untuk user: <span class="text-primary font-bold">${username}</span></p>
                    <input type="text" id="new-password-input" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan password baru">
                    <p id="modal-pass-error" class="text-red-500 text-xs font-bold"></p>
                    <div class="flex gap-2 justify-end pt-2">
                        <button onclick="window.closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold hover:bg-slate-300">Batal</button>
                        <button onclick="window.eksekusiGantiPassword('${id}')" class="px-4 py-2 bg-primary text-white rounded-lg font-bold hover:bg-red-900 shadow-md">Simpan</button>
                    </div>
                </div>
            `;
            window.showModal("Ganti Password", "", false, html);
        };

        window.eksekusiGantiPassword = async (id) => {
            const newPass = document.getElementById('new-password-input').value;
            if(!newPass || newPass.length < 4) {
                document.getElementById('modal-pass-error').textContent = "Password minimal 4 karakter.";
                return;
            }
            try {
                await updateDoc(getDocRef('users', id), { password: newPass });
                window.closeModal();
                window.navigateTo('kelola_pengguna');
                setTimeout(() => window.showModal("Berhasil", "Password pengguna telah diperbarui."), 300);
            } catch(e) { window.showModal("Gagal", "Gagal mengubah password.", true); }
        };

        window.tampilkanKonfirmasiHapus = (col, id, redirectView) => {
            const customActions = `
                <button onclick="window.closeModal()" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold hover:bg-slate-300">Batal</button>
                <button onclick="window.eksekusiHapusDoc('${col}', '${id}', '${redirectView}')" class="px-6 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 shadow-md">Ya, Hapus</button>
            `;
            window.showModal("Konfirmasi Hapus", "Tindakan ini tidak dapat dibatalkan. Yakin ingin menghapus data ini secara permanen?", true, customActions);
        };

        window.eksekusiHapusDoc = async (col, id, redirectView) => {
            try {
                await deleteDoc(getDocRef(col, id));
                window.closeModal();
                if(redirectView && redirectView !== 'null') window.navigateTo(redirectView);
                setTimeout(() => window.showModal("Berhasil", "Data telah dihapus dari sistem."), 300);
            } catch(err) { window.showModal("Error", "Gagal menghapus data.", true); }
        };

        function viewPengaturan() {
            const set = window.appState.pengaturan;
            return `
                <div class="fade-in max-w-2xl mx-auto pb-10">
                    <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center"><i class="fas fa-cogs text-primary mr-3"></i> Pengaturan Sistem</h2>
                    <div class="glass-card p-6 md:p-8 bg-white">
                        <form onsubmit="window.simpanPengaturan(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Nama Aplikasi / Portal</label>
                                <input type="text" id="set-nama" required value="${set.nama_aplikasi}" class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none text-lg font-bold">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">URL Logo Sekolah/Institusi (Opsional)</label>
                                <input type="url" id="set-logo" value="${set.logo_url || ''}" placeholder="https://contoh.com/logo.png" class="w-full px-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary outline-none">
                                <p class="text-xs text-slate-500 mt-2">Biarkan kosong untuk menggunakan logo inisial default. Pastikan URL gambar berakhiran .png atau .jpg.</p>
                            </div>
                            
                            <div class="pt-6 border-t border-slate-100">
                                <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-black shadow-lg hover:bg-red-900 transition-colors active:scale-95"><i class="fas fa-save mr-2"></i> Simpan Pengaturan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.simpanPengaturan = async (e) => {
            e.preventDefault();
            const data = {
                nama_aplikasi: document.getElementById('set-nama').value,
                logo_url: document.getElementById('set-logo').value,
                timestamp: Date.now()
            };
            try {
                await setDoc(getDocRef('pengaturan', 'app_settings'), data);
                window.showModal("Tersimpan", "Pengaturan sistem berhasil diperbarui. Tampilan web akan langsung berubah untuk semua pengguna.");
            } catch(err) { window.showModal("Error", "Gagal menyimpan pengaturan.", true); }
        };

        function viewInformasi() {
            let html = `<div class="fade-in max-w-3xl mx-auto pb-10"><h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center"><i class="fas fa-bullhorn text-primary mr-3"></i> Informasi & Pengumuman</h2><div class="space-y-6">`;
            if(window.appState.informasiList.length === 0) html += `<div class="text-center py-10 glass-card bg-white text-slate-500 font-bold"><i class="far fa-newspaper text-4xl mb-3"></i><br>Belum ada informasi.</div>`;
            else {
                window.appState.informasiList.forEach(info => {
                    html += `
                        <div class="glass-card p-6 md:p-8 border-l-8 border-l-secondary bg-white">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-xl font-black text-slate-800 leading-snug">${info.judul}</h3>
                                <span class="text-[10px] font-bold text-slate-400 whitespace-nowrap ml-4 bg-slate-50 px-2 py-1 rounded"><i class="far fa-clock mr-1"></i>${formatDate(info.timestamp)}</span>
                            </div>
                            <p class="text-slate-600 whitespace-pre-wrap leading-relaxed text-sm md:text-base">${info.isi}</p>
                            ${info.link_gambar ? `<img src="${info.link_gambar}" class="mt-6 rounded-xl max-h-80 object-cover w-full shadow-sm border border-slate-100" onerror="this.style.display='none'">` : ''}
                        </div>
                    `;
                });
            }
            html += `</div></div>`; return html;
        }

        function viewProfil() { return `<div class="fade-in text-center p-10"><i class="fas fa-id-card text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Profil Pengguna</h3><p class="text-sm text-slate-500">Fitur ini tersedia dan berfungsi penuh di dalam koneksi Firestore.</p></div>`; }
        function viewKaryaSaya() { return `<div class="fade-in text-center p-10"><i class="fas fa-folder-open text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Karya Saya</h3><p class="text-sm text-slate-500">Daftar karya Anda akan tampil di sini.</p></div>`; }
        function viewSapa() { return `<div class="fade-in text-center p-10"><i class="fas fa-envelope-open-text text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Sapa Pengawas</h3><p class="text-sm text-slate-500">Kirim pesan langsung ke Ibu Pengawas Lilik Rahmawati, M.Pd.</p></div>`; }
        function viewDiskusi(c) { c.innerHTML = `<div class="fade-in text-center p-10"><i class="fas fa-comments text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Ruang Diskusi</h3><p class="text-sm text-slate-500">Forum obrolan interaktif publik antar guru dan siswa.</p></div>`; }
        function viewKelolaInformasi() { return `<div class="fade-in text-center p-10"><i class="fas fa-edit text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Kelola Informasi</h3><p class="text-sm text-slate-500">Admin memposting berita di sini.</p></div>`; }
        function viewPantauKarya(c) { c.innerHTML = `<div class="fade-in text-center p-10"><i class="fas fa-chart-pie text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Dasbor Pantauan</h3><p class="text-sm text-slate-500">Admin melihat statistik semua karya dan rapor yang masuk.</p></div>`; }
        function viewKotakMasuk(c) { c.innerHTML = `<div class="fade-in text-center p-10"><i class="fas fa-inbox text-5xl text-rose-200 mb-4"></i><h3 class="text-xl font-bold">Kotak Masuk</h3><p class="text-sm text-slate-500">Membaca pesan dari form Sapa Pengawas.</p></div>`; }

        // Start App
        window.onload = () => { initFirebaseAuth(); };

    </script>
</body>
</html>
